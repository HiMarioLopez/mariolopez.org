name: "🤖 Daily Code Quality & Excellence Audit"

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC (adjust: weekly = '0 0 * * 0')
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  issues: write
  models: read  # ✅ FREE GitHub Models access!

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install deps
      run: bun install --frozen-lockfile

    - name: Capture metadata
      id: meta
      run: |
        echo "run_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Read audit prompt
      id: read-prompt
      run: |
        echo "prompt<<EOF" >> $GITHUB_OUTPUT
        cat .github/audit_prompt.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Collect codebase context
      id: context
      run: |
        echo "files<<EOF" >> $GITHUB_OUTPUT
        
        echo "=== package.json ===" >> $GITHUB_OUTPUT
        cat package.json >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        
        echo "=== lib/config.ts ===" >> $GITHUB_OUTPUT
        cat lib/config.ts >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        
        echo "=== lib/constants.ts ===" >> $GITHUB_OUTPUT
        cat lib/constants.ts >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        
        echo "=== File tree ===" >> $GITHUB_OUTPUT
        find app components lib -type f -name "*.ts" -o -name "*.tsx" | head -100 >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        
        echo "=== Key components (first 50 lines each) ===" >> $GITHUB_OUTPUT
        for file in app/[lang]/layout.tsx app/[lang]/human/page.tsx app/[lang]/machine/page.tsx components/hero.tsx components/recently-played.tsx; do
          if [ -f "$file" ]; then
            echo "--- $file ---" >> $GITHUB_OUTPUT
            head -50 "$file" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi
        done
        
        echo "=== API Routes ===" >> $GITHUB_OUTPUT
        for file in app/api/*/route.ts; do
          if [ -f "$file" ]; then
            echo "--- $file ---" >> $GITHUB_OUTPUT
            head -40 "$file" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi
        done
        
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Run AI Audit
      id: audit
      uses: actions/ai-inference@v1
      with:
        model: 'openai/gpt-4o-mini'  # Free, fast, and excellent for code analysis
        max-tokens: 2048
        system-prompt: |
          # Code Quality & Engineering Excellence Assessment
          ${{ steps.read-prompt.outputs.prompt }}
        prompt: |
          Analyze this Next.js 16 + React 19 codebase.
          
          📅 Date: ${{ steps.meta.outputs.run_date }}
          
          ## Codebase Files:
          ${{ steps.context.outputs.files }}
          
          🎯 Based on the files above, assess code quality per the system prompt.
          🔍 Focus on: constants usage, Server Components, performance, architecture.
          
          Output **ONLY** valid JSON (no markdown):
          {
            "summary": "Executive overview (1-2 sentences)",
            "overall_score": "A-F",
            "issues": [
              {
                "priority": "High|Medium|Low",
                "category": "e.g. Performance, Security",
                "file": "app/page.tsx",
                "line": 42,
                "issue": "Specific problem",
                "fix": "Actionable recommendation",
                "docs": "https://nextjs.org/docs/..."
              }
            ],
            "best_practices": ["3-5 general improvements"]
          }

    - name: Create/Update Audit Issue
      if: steps.audit.outputs.response
      uses: actions/github-script@v7
      env:
        AUDIT_JSON: ${{ steps.audit.outputs.response }}
      with:
        script: |
          const stripCodeFence = (text = '') => {
            const trimmed = text.trim();
            if (!trimmed.startsWith('```')) {
              return trimmed;
            }

            const firstNewline = trimmed.indexOf('\n');
            if (firstNewline === -1) {
              return trimmed;
            }

            const withoutFence = trimmed.slice(firstNewline + 1);
            const closingIndex = withoutFence.lastIndexOf('```');

            if (closingIndex === -1) {
              return withoutFence.trim();
            }

            return withoutFence.slice(0, closingIndex).trim();
          };

          try {
            const rawResponse = process.env.AUDIT_JSON ?? '';
            const audit = JSON.parse(stripCodeFence(rawResponse));
            
            if (!audit.issues?.length) {
              core.summary.addHeading('✅ Code Audit Passed!', 2);
              core.summary.addRaw(`**Score:** ${audit.overall_score || 'A'}\n\n${audit.summary || 'No issues found.'}`);
              await core.summary.write();
              return;
            }
            
            const issueSections = audit.issues.map((issue, idx) => {
              const docsLine = issue.docs ? `**Docs:** ${issue.docs}` : '';
              return [
                `### ${idx + 1}. ${issue.priority} - ${issue.category}`,
                `**File:** [\`${issue.file}\`@${issue.line}](${{ github.server_url }}/${context.repo.owner}/${context.repo.repo}/blob/${{ github.ref_name }}/${issue.file}#L${issue.line})`,
                '',
                `**Issue:** ${issue.issue}`,
                `**Fix:** ${issue.fix}`,
                docsLine,
              ]
                .filter(Boolean)
                .join('\n');
            });

            const bestPractices =
              audit.best_practices?.length
                ? audit.best_practices.map((item) => `- ${item}`).join('\n')
                : 'None';

            const body = [
              `# 🤖 Automated Code Audit (${new Date().toDateString()})`,
              '',
              `**Score:** ${audit.overall_score} • **Issues:** ${audit.issues.length}`,
              '',
              '## 📋 Summary',
              audit.summary,
              '',
              '## 🚨 Issues',
              issueSections.join('\n\n'),
              '',
              '## 💡 Best Practices',
              bestPractices,
              '',
              '---',
              `*Powered by GitHub Models • [View run](${{ github.server_url }}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
            ].join('\n');
            
            // Also write to job summary
            core.summary.addHeading(`🤖 Code Audit [${audit.overall_score}]`, 2);
            core.summary.addRaw(`**Issues:** ${audit.issues.length}\n\n${audit.summary}`);
            await core.summary.write();
            
            // Create or update existing audit issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              creator: 'github-actions[bot]', state: 'open'
            });
            const auditIssue = issues.find(i => i.title.includes('Code Audit'));
            
            const title = `🤖 Code Quality Audit [${audit.overall_score}]`;
            
            if (auditIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: auditIssue.number, title, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automated', 'code-quality']
              });
            }
          } catch (e) {
            core.error(`Audit failed: ${e}`);
            core.summary.addHeading('❌ Audit Failed', 2);
            core.summary.addRaw(`Error: ${e.message || e}`);
            await core.summary.write();
          }
